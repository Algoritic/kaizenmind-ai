services:
  secops-mcp:
    # assuming you cloned https://github.com/securityfortech/secops-mcp into ./secops-mcp
    build: ./secops-mcp
    container_name: secops-mcp
    # the readme says "docker run -it --rm secops-mcp", so we expose a port and bind 0.0.0.0
    command: ["python", "main.py", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    volumes:
      # optional: persist wordlists, results, etc.
      - ./secops-mcp/data:/app/data
    networks:
      - mcp-net
  app:
    build: .
    image: pentestai:local
    container_name: pentestai_app
    ports:
      - "8501:8501"
    environment:
      - PYTHONUNBUFFERED=1
      # Optional, if you wire LLMs later:
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    volumes:
      - ./reports:/app/reports
      # Put the repo to analyze in ./target on your host:
      - ./target:/app/target:ro
    networks:
      - mcp-net
    command: streamlit run ui/streamlit_app.py --server.port=8501 --server.address=0.0.0.0

  cli:
    image: pentestai:local
    container_name: pentestai_cli
    depends_on:
      - app
    profiles: ["cli"]
    environment:
      - PYTHONUNBUFFERED=1
      - OLLAMA_URL=http://host.docker.internal:11434 
      - OLLAMA_MODEL=gpt-oss:20b
      - LLM_BACKEND=ollama
      - USE_LANGGRAPH="1"
      - PENTESTAI_LOG_LEVEL=INFO
      - PENTESTAI_LOG_FILE=/app/logs/pentestai.log
    volumes:
      - ./logs:/app/logs
      - ./target:/app/target:ro
      - ./reports:/app/reports
    networks:
      - mcp-net
    command: python -m pentestai.cli --repo /app/target

networks:
  mcp-net:
    driver: bridge